<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ERi-TV Live Stream</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🇪🇷 ERi-TV Live Stream</h1>
            <p>Watch Eritrean Television Live</p>
        </header>

        <main>
            <div class="video-container">
                <video id="video" controls autoplay muted></video>
                <div id="loading" class="loading">Loading stream...</div>
                <div id="error" class="error" style="display: none;"></div>
            </div>

            <div class="channels" id="channels">
                <!-- Channels will be loaded dynamically -->
            </div>

            <div class="info">
                <h2>About ERi-TV</h2>
                <p>
                    ERi-TV is the national television broadcaster of Eritrea. 
                    This web application provides access to live streams sourced from the 
                    <a href="https://github.com/iptv-org/iptv" target="_blank">IPTV-org</a> community project.
                </p>
            </div>
        </main>

        <footer>
            <p>Stream source: <a href="https://github.com/iptv-org/iptv/blob/master/streams/er.m3u" target="_blank">iptv-org/iptv</a></p>
            <p>Powered by <a href="https://github.com/video-dev/hls.js/" target="_blank">HLS.js</a></p>
        </footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="app.js"></script>
</body>
</html>
